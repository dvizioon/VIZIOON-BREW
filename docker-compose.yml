services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/dev.db
      LOCAL_STORAGE_PATH: /app/storage
      PYTHON_BIN: /usr/bin/python3
      HOSTNAME: 0.0.0.0
    volumes:
      - brew-data:/data
      - ${LOCAL_STORAGE_PATH:-./storage}:/app/storage
    privileged: true
    restart: unless-stopped

volumes:
  brew-data:
