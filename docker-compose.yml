services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_PORT: ${PORT:-3630}
        APP_ENV: ${APP_ENV:-production}
    container_name: vizioon-brew
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3630}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_PREFIX: ${DB_PREFIX:-}
      DB_DIALECT: ${DB_DIALECT:-postgres}
      DB_DEBUG: ${DB_DEBUG:-false}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      SEED_MASTER_EMAIL: ${SEED_MASTER_EMAIL:-}
      SEED_MASTER_PASSWORD: ${SEED_MASTER_PASSWORD:-}
      SEED_MASTER_NAME: ${SEED_MASTER_NAME:-Admin}
      LOCAL_STORAGE_PATH: /app/storage
    ports:
      - "${PORT:-3630}:${PORT:-3630}"
    volumes:
      - brew_storage:/app/storage
    privileged: true

volumes:
  brew_storage:
